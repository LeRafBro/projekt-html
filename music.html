<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Catalogue</title>
    <link rel="stylesheet" href="./css/main.css" />
    <script src="./music.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <h1 class="page-title">MUSIC</h1>
      <p class="note">
        To add favourites, please add them directly inside the code.
      </p>
      <div class="featured">
        <img
          src="./assets/album1.jpg"
          class="featured-img"
          width="280"
          height="280"
          alt="Featured album cover 1"
        />
        <img
          src="./assets/album2.jpg"
          class="featured-img"
          width="280"
          height="280"
          alt="Featured album cover 2"
        />
      </div>
    </header>

    <main>
      <form class="search-form" id="searchForm" role="search">
        <label for="searchInput" class="visually-hidden">
          Album or artist
        </label>
        <input
          type="search"
          id="searchInput"
          placeholder="Enter album or artist..."
          autocomplete="off"
          required
        />
        <button type="submit" id="searchButton">Search</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section
        id="results"
        class="results"
        aria-label="Search results"
      ></section>
    </main>
  </body>
</html>
